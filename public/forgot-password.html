<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | KeyForge</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      background: #101426;
      color: #eef2ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .recovery-card {
      width: min(100%, 420px);
      padding: 30px;
      border: 1px solid #2b3552;
      border-radius: 16px;
      background: #171e34;
      box-shadow: 0 18px 50px #0005;
      box-sizing: border-box;
    }
    h1 { margin: 0 0 8px; font-size: 1.65rem; }
    .hint { margin: 0 0 24px; color: #aab5d0; line-height: 1.5; }
    label { display: block; margin: 0 0 8px; font-size: .92rem; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #3a4668;
      border-radius: 9px;
      background: #0e1426;
      color: #eef2ff;
      font: inherit;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      background: linear-gradient(120deg, #08cde8, #8b5cf6);
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    #forgotPasswordMessage { min-height: 1.5em; margin: 14px 0 0; color: #aab5d0; }
    .back-link { display: inline-block; margin-top: 18px; color: #61dcf2; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="recovery-card">
    <img src="/images/keyforge-wordmark.png" alt="KEYFORGE — Key Management System" class="recovery-wordmark">
    <h1>Forgot password?</h1>
    <p class="hint">Enter the email address associated with your account. If it matches an account, a password reset link will be sent.</p>

    <form id="forgotPasswordForm">
      <label for="recoveryEmail">Email address</label>
      <input id="recoveryEmail" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
      <button id="forgotPasswordSubmit" type="submit">Send reset link</button>
      <p id="forgotPasswordMessage" role="status" aria-live="polite"></p>
    </form>

    <a class="back-link" href="/">← Back to login</a>
  </main>

  <script>
    const form = document.getElementById('forgotPasswordForm');
    const submitButton = document.getElementById('forgotPasswordSubmit');
    const message = document.getElementById('forgotPasswordMessage');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      submitButton.disabled = true;
      submitButton.textContent = 'Sending…';

      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('recoveryEmail').value.trim()
          })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.message || data.error || 'Unable to process the request. Please try again.');
        }

        message.textContent = data.message || 'If an account with that email exists, a reset link has been sent.';
      } catch (error) {
        message.textContent = error.message || 'Network error. Please try again.';
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Send reset link';
      }
    });
  </script>
</body>
</html>
