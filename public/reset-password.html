<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | KeyForge</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      background: #101426;
      color: #eef2ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .recovery-card {
      width: min(100%, 420px);
      padding: 30px;
      border: 1px solid #2b3552;
      border-radius: 16px;
      background: #171e34;
      box-shadow: 0 18px 50px #0005;
      box-sizing: border-box;
    }
    h1 { margin: 0 0 8px; font-size: 1.65rem; }
    .hint { margin: 0 0 24px; color: #aab5d0; line-height: 1.5; }
    label { display: block; margin: 0 0 8px; font-size: .92rem; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #3a4668;
      border-radius: 9px;
      background: #0e1426;
      color: #eef2ff;
      font: inherit;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      background: linear-gradient(120deg, #08cde8, #8b5cf6);
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    #resetPasswordMessage { min-height: 1.5em; margin: 14px 0 0; color: #aab5d0; }
    .back-link { display: inline-block; margin-top: 18px; color: #61dcf2; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="recovery-card">
    <img src="/images/keyforge-wordmark.png" alt="KEYFORGE — Key Management System" class="recovery-wordmark">
    <h1>Reset password</h1>
    <p class="hint">Choose a new password. The reset link can only be used once and expires after 15 minutes.</p>

    <form id="resetPasswordForm">
      <label for="newPassword">New password</label>
      <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">

      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Re-enter password">

      <button id="resetPasswordSubmit" type="submit">Update password</button>
      <p id="resetPasswordMessage" role="status" aria-live="polite"></p>
    </form>

    <a class="back-link" href="/">← Back to login</a>
  </main>

  <script>
    const form = document.getElementById('resetPasswordForm');
    const submitButton = document.getElementById('resetPasswordSubmit');
    const message = document.getElementById('resetPasswordMessage');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';

      const password = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        message.textContent = 'Passwords do not match.';
        return;
      }

      const token = new URLSearchParams(window.location.search).get('token');
      if (!token) {
        message.textContent = 'Reset token is missing. Request a new reset link.';
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Updating…';

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.message || data.error || 'Unable to reset password. The link may have expired.');
        }

        message.textContent = data.message || 'Password updated. You can now sign in with your new password.';
        form.reset();
      } catch (error) {
        message.textContent = error.message || 'Network error. Please try again.';
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Update password';
      }
    });
  </script>
</body>
</html>
